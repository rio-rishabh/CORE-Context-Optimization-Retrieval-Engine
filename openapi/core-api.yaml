openapi: 3.0.3
info:
  title: CORE Context Optimization Retrieval Engine API
  description: |
    Stateless semantic memory for chat. Conversations are keyed by `conversationId`.
    The server does not hold session state in JVM memory beyond pluggable MemoryStore backends.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local development

# Public API for local dev; add API key or OAuth here for production
security: []

tags:
  - name: Health
    description: Liveness and readiness
  - name: Conversations
    description: Ingest turns and build retrieval context

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check server health
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /conversations/{conversationId}/turns:
    post:
      tags: [Conversations]
      operationId: ingestTurn
      summary: Ingest one user/assistant exchange (write path)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
      responses:
        '204':
          description: Turn stored successfully
        '400':
          $ref: '#/components/responses/BadRequest'

  /conversations/{conversationId}/chat:
    post:
      tags: [Conversations]
      operationId: buildChatContext
      summary: Build retrieval context for a new user question (read path)
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Chat context built successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /conversations/{conversationId}:
    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: Delete a conversation and all its memories
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '204':
          description: Conversation deleted successfully
        '404':
          description: Conversation not found

components:
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
      description: Stable id from client (URL hash, thread id, etc.)

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: core

    TurnRequest:
      type: object
      required: [userText, assistantText]
      properties:
        userText:
          type: string
          minLength: 1
        assistantText:
          type: string
          minLength: 1

    ChatRequest:
      type: object
      required: [userText]
      properties:
        userText:
          type: string
          minLength: 1

    ChatResponse:
      type: object
      required: [systemContext, memories]
      properties:
        systemContext:
          type: string
          description: Formatted block for LLM system prompt
        memories:
          type: array
          items:
            $ref: '#/components/schemas/MemoryChunkDto'

    MemoryChunkDto:
      type: object
      required: [id, conversationId, role, text, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        text:
          type: string
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
